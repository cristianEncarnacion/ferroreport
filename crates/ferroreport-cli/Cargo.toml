[package]
name = "ferroreport-cli"
description = "JasperReports alternative on the command line: renders JasperReports JRXML (6 and 7) and .ferro templates without a JVM to PDF, Excel (XLSX), Word (DOCX), PowerPoint (PPTX), ODS, ODT, CSV and HTML; also an HTTP server and a migration checker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The database drivers need a newer Rust than the library (1.86): SQLite 3.54 comes with
# rusqlite 0.41, which needs 1.89.
rust-version = "1.89"
readme = "../../README.md"
homepage.workspace = true
keywords = ["jasperreports", "jrxml", "pdf", "report", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "ferroreport"
path = "src/main.rs"

[dependencies]
ferroreport = { path = "../ferroreport", version = "1.4.0" }
serde_json = "1"
tiny_http = "0.12"
httpdate = "1"
socket2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"
# Signing PDFs (and the TLS of the database drivers).
ring = "0.17"
p12 = "0.6"
yasna = { version = "0.5", features = ["std"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
des = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
# The page pictures of `migrate --jasper` (the png the library already reads images with).
png = "0.17"
# Databases (feature `db`, on by default): the template's query, run as JasperReports runs it.
rusqlite = { version = "0.43", features = ["bundled"], optional = true }
postgres = { version = "0.19", features = ["with-chrono-0_4"], optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
webpki-roots = { version = "1", optional = true }
rust_decimal = { version = "1", features = ["db-postgres"], optional = true }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"], optional = true }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "rustls-webpki-roots", "chrono", "rust_decimal"], optional = true }
tokio = { version = "1", features = ["rt", "net"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }

[features]
default = ["db"]
db = ["dep:rusqlite", "dep:postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots", "dep:rust_decimal", "dep:mysql", "dep:tiberius", "dep:tokio", "dep:tokio-util", "dep:futures-util"]
